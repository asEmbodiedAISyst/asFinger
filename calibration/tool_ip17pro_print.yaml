# The pusher that is on the arm: iphone17pro_print_20261108 as built (round rod, 15 mm, hemispherical tip; phone plate).
# Geometry from the as-built frame table in docs/en/user/robot-calibration.md (frames F_robot, T_tip, T_tcp), STL in
# sim/assets/meshes/ipush_print.stl. Use it with `--tool calibration/tool_ip17pro_print.yaml`; the robot/ tools and
# the simulator scene load it by default. The library's own `pusher_ip17` describes an older design.
#
# How F_robot (the tool's mounting face) sits on the arm's flange frame link6 is NOT in the frame file. Used here:
#   p_link6 = Rz(180 deg) * p_F_robot + (0, 0, 8.98 mm)
# - Rz(180): on the arm the rod is on the -x side of link6 (seen in the wrist and overhead pictures, 2026-11-16).
# - 8.98 mm: inferred, not measured. With it the tip sphere centre T_tip lands on the TCP of `pusher_ip17`
#   (-96.33, 0, 172.18) mm to 0.01 mm, which was computed from an earlier MuJoCo model with the tool on link6.
#   A wrist-camera measurement of the tip height above the whiteboard (2026-11-17) agrees with it to about 2 mm
#   and with 0 mm to about 5 mm. To be confirmed by the owner.
# tcp: origin = T_tcp, the end of the rod (apex of the tip sphere); z along the rod, as in the frame file.
#   x and y are turned 180 deg about the rod compared with T_tcp, so that x points away from the base when the rod
#   points down: the library limits the heading of the tool x axis around "forward" (max_yaw_deg).
# tip.radius: the tip is a sphere of this radius centred `radius` behind the TCP on the rod axis (T_tip).
#   Whatever the lean of the rod, the lowest point of the tool is `radius` below that centre.
# payload: copied from `pusher_ip17` on purpose. calibration/b601_rs.yaml (link masses) was fitted with it in the
#   model; changing it here would shift the gravity compensation. The real weights have not been measured.
# home_deg: rod vertical, tool x forward, tip at (0.24, 0, 0.12) m. The owner accepted a vertical rod for simple data
#   collection (2026-11-17); pushing in general should not fix the tool's orientation. Until 2026-11-17 the home
#   was [0, 20, 28.6, -38.8, 0, 0] (the joint angles of `pusher_ip17`), where the rod leans 30 deg forward.
# cartesian: z lower limit = table (calibration/table.yaml, +0.020 m for the TCP with the rod vertical) + 5 mm.
name: ip17pro_print_20261108
mount_frame: link6
tcp:
  xyz: [-0.100090, 0.0, 0.178675]
  rpy_deg: [0.0, -30.0, 0.0]
tip:
  radius: 0.0075
phone:                      # the phone on the tool, from the as-built frame table (C_main), in link6 like the tcp
  # its camera frame in the AR convention iMuninn reports poses in: x to the right of the landscape picture,
  # y up, z out of the back camera towards the screen (the camera looks along -z)
  camera_xyz: [0.044850, 0.0, 0.102911]
  camera_rot: [[0.0, 0.571573, 0.820552], [1.0, 0.0, 0.0], [0.0, 0.820552, -0.571573]]   # columns: its x, y, z axes in link6
  # its body, for keeping it off the table (as-built frame table, P_phone: centre of the screen face; x across the phone,
  # y along it, z out of the screen). Half sizes include the 3.25 mm case; the body reaches from z_lo to z_hi.
  body_xyz: [0.041252, 0.041390, 0.079148]
  body_rot: [[0.571573, 0.0, 0.820551], [0.0, -1.0, 0.0], [0.820551, 0.0, -0.571573]]
  body_half: [0.0392, 0.0782]
  body_z: [-0.012, 0.00325]
payload:
  mass_kg: 0.301
  com_xyz: [0.023092, 0.036419, 0.062015]
home_deg: [0.0, 71.4, 68.9, -57.6, 0.0, 0.0]
cartesian:
  x: [0.19, 0.50]
  y: [-0.20, 0.20]
  z: [0.025, 0.20]
  max_speed: 0.25          # m/s
  max_ang_speed: 2.0       # rad/s
  max_tilt_deg: 30.0       # angle between the rod (TCP z) and straight down
  max_yaw_deg: 60.0        # heading of the TCP x axis about world z
# sim: how the simulator twin (sim/twin.py) draws this tool, what of it collides and where its cameras are. Ignored by
#   the control library. Positions in metres and quaternions [w, x, y, z] in the tool's own frame F_robot of
#   the as-built frame table (the frame of the STL); `mount` places F_robot on mount_frame (the same transform as the comment
#   at the top: Rz(180 deg), then 8.98 mm along the flange axis; the 8.98 mm is inferred, not measured).
#   To swap the pusher: write another tool file with its own sim block and point sim/twin.yaml at it.
sim:
  mount: {pos: [0.0, 0.0, 0.00898], quat: [0.0, 0.0, 0.0, 1.0]}
  mesh: {file: ../sim/assets/meshes/ipush_print.stl, scale: 0.001, rgba: [0.08, 0.08, 0.09, 1.0]}   # path relative to this file; black PLA
  collision:                  # the parts that touch things: rod (R_rod origin to the tip sphere centre T_tip), mounting disc
    - {name: rod, type: capsule, fromto: [0.00789, 0.0, 0.010, 0.09634, 0.0, 0.1632], radius: 0.0075}
    - {name: disc, type: cylinder, pos: [0.0, 0.0, 0.005], quat: [1, 0, 0, 0], size: [0.0284, 0.005]}
  phone:                      # the phone in its case (P_phone: centre of the screen face, z out of the screen); a box
    pos: [-0.041252, -0.041390, 0.070168]
    quat: [0.462832, 0.0, -0.886446, 0.0]
    half: [0.0392, 0.0782]    # across and along the phone, case included (as phone.body_half above)
    z: [-0.012, 0.00325]      # from the back of the case to the screen glass (as phone.body_z above)
    rgba: [0.10, 0.11, 0.13, 1.0]
    collide: true
  cameras:                    # OpenCV axes (x right in the recorded picture, y down, z forward)
    wrist:                    # C_ultrawide_cv of the as-built frame table: the ultra wide lens records the wrist video
      pos: [-0.044850, 0.019240, 0.093931]
      quat: [0.626812, -0.327272, 0.327272, -0.626812]
      intrinsics: {width: 640, height: 480, fx: 255.9, fy: 255.9, cx: 318.9, cy: 240.0}   # as reported by the phone; no distortion model
