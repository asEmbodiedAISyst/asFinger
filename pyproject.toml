[project]
name = "asFinger"
version = "0.1.0"
description = "A parametric push rod with a phone as the wrist camera: one JSON config becomes printable STL, a MuJoCo model and a web editor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "WEI Jinqi" }
]
requires-python = ">=3.11"
dependencies = [
    "manifold3d>=3.0",
    "numpy>=1.26",
]

[project.scripts]
asfinger = "asfinger.__main__:main"

[project.urls]
Homepage = "https://asembodiedaisyst.github.io/asFinger/"
Documentation = "https://asembodiedaisyst.github.io/asFinger/docs/"
Repository = "https://github.com/asEmbodiedAISyst/asFinger"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asfinger"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # the formatter wraps code; long comments, docstrings and the HTML template stay as written
    "E731",  # small local lambdas are used on purpose in the geometry code
    "E741",  # l, I and O are the usual names in the maths (lines, inertia)
    "B905",  # zip() over vectors of the same fixed length
]

[tool.ruff.lint.per-file-ignores]
# robot/ moves a real arm and was imported without code changes: rules that would need an edit are off there
"robot/*.py" = ["I001", "E401", "UP031"]
"sim/twin_view.py" = ["I001"]  # `import twin` must come first: it sets up MuJoCo for off-screen pictures

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
]

[dependency-groups]
dev = [
    "mujoco>=3.2",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.0",
]
# What the scripts in robot/ and sim/ import: `uv sync --group robot`. The package `asfinger` does not need it.
robot = [
    "rebot-control[sim]",                              # arm control and its simulator (pinocchio, mujoco)
    "motorbridge>=0.5.6; sys_platform == 'linux'",     # the real arm: RobStride motors over SocketCAN
    "motorbridge-smart-servo>=0.0.4",                  # the leader arm of robot/teleop_star.py
    "imuninn[video]>=0.3.0",                           # the phones (video decoding through av)
    "sharklog>=0.2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",                     # AprilTag 36h11 through cv2.aruco
    "pillow>=10",
    "av>=12",
    "pyarrow>=15",                                     # robot/to_lerobot.py
]

[tool.uv.sources]
# rebot-control is not on PyPI. This commit has the same code as the version the scripts were written against.
rebot-control = { git = "https://github.com/asEmbodiedAISyst/rebot-control", rev = "69c7182616807f5a34e9483f2c9950675ea771b9" }
