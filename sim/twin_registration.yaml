# Where the cameras and the markers of the twin scene are: the values that sim/twin.py uses. Arm base frame, metres.
# They were fitted to recorded video of one setup; fit them again for another setup or after a camera moved.
#   top_camera: position and axes (columns: image right, image down, optical axis) of the overhead camera. The entry
#     that default_session names is used. A scene can hold one entry for each place the camera has been in.
#   wrist_camera: on the flange (link6). It replaces the as-built C_ultrawide frame of the tool file in sim/twin.py.
#     dist_k1k2: radial distortion (OpenCV), not used by the renderer
#   board_white: the white area of the whiteboard (short, long side); board_frame: the width of its aluminium frame.
#   board_tags: tag centres and turns in the board frame (origin: centre of the board, x along its short side, tag 1
#     on the +y half)
default_session: default
top_camera:
  default:
    pos: [0.54162, -0.1436, 0.78305]
    R:
    - [0.75191, 0.01149, -0.65917]
    - [0.00086, -0.99986, -0.01644]
    - [-0.65927, 0.0118, -0.75182]
board_white: [0.26932, 0.36888]
board_frame: 0.015
board_tags:
  size: 0.05
  1:
    pos: [0.0984, 0.1451]
    yaw_deg: -88.75
  2:
    pos: [-0.093, -0.1482]
    yaw_deg: -90.84
wrist_camera:
  frame: flange
  pos: [0.03837, -0.02582, 0.10714]
  R:
  - [0.06742, -0.49007, -0.86908]
  - [0.99716, 0.00389, 0.07516]
  - [-0.03345, -0.87168, 0.48894]
  dist_k1k2: [-0.02791, 0.01705]
