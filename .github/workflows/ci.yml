name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint
      run: uv run ruff check

    - name: Check formatting
      run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The first version must be the same as requires-python in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build the site
      run: npm run build
      env:
        SITE_URL: https://asembodiedaisyst.github.io
        BASE_PATH: /asFinger/
